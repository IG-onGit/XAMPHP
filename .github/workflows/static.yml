# Deploys the static site in /docs to GitHub Pages.
name: Deploy OSS Webpage

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/static.yml"
  # Manual run from the Actions tab ("Run workflow" button).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; don't cancel one that's mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
